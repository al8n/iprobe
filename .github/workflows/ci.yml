name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 1 */7 * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1

jobs:
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Check formatting
        run: cargo +stable fmt --all -- --check

  stable:
    name: stable (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Check
        run: cargo +stable check --all-features --all-targets
      - name: Clippy
        run: cargo +stable clippy --all-targets --all-features -- -D warnings
      - name: Test all targets
        run: cargo +stable test --all-features --all-targets
      - name: Test doctests
        run: cargo +stable test --all-features --doc

  msrv:
    name: MSRV 1.71.0 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.71.0
        run: rustup toolchain install 1.71.0 --profile minimal
      - name: Check
        run: cargo +1.71.0 check --all-features --all-targets
      - name: Test all targets
        run: cargo +1.71.0 test --all-features --all-targets
      - name: Test doctests
        run: cargo +1.71.0 test --all-features --doc

  docs-package-semver:
    name: docs, package, and semver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Check rustdoc warnings
        run: RUSTDOCFLAGS=-Dwarnings cargo +stable doc --all-features --no-deps
      - name: Install cargo-semver-checks
        run: cargo +stable install cargo-semver-checks --version 0.50.0 --locked
      - name: Check semver compatibility
        run: cargo +stable semver-checks check-release --baseline-version 0.1.2 --release-type patch --all-features
      - name: Check package
        run: cargo +stable package --all-features
      - name: Check publish dry run
        run: cargo +stable publish --dry-run --all-features

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs:
      - rustfmt
      - stable
      - msrv
      - docs-package-semver
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust and llvm-tools
        run: |
          rustup update stable --no-self-update && rustup default stable
          rustup component add llvm-tools-preview --toolchain stable
      - name: Install cargo-llvm-cov
        run: cargo +stable install cargo-llvm-cov --version 0.8.7 --locked
      - name: Check coverage threshold
        run: cargo +stable llvm-cov --all-features --workspace --lcov --output-path lcov.info --fail-under-lines 90
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          files: lcov.info
          disable_search: true
          fail_ci_if_error: true
